
services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - ./02_api_backend/.env
    volumes:
      - ./04_external_data_services/data:/app/04_external_data_services/data
      - ./05_rag_retrieval/vector_db:/app/05_rag_retrieval/vector_db
      - ./08_audit_logging/data:/app/08_audit_logging/data
    restart: unless-stopped

  frontend:
    build:
      context: ./01_web_app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
