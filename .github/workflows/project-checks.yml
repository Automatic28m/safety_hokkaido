name: Project checks

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01_web_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 01_web_app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile runtime.py
      - run: python -m compileall -q 02_api_backend 03_travel_ai_agent 04_external_data_services 05_data_integration 06_risk_knowledge_services 07_decision_llm_engine 08_recommendation_feedback
